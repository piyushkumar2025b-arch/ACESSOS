name: Build & Release AccessOS Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug, release, or both)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build AccessOS Hardware-Ready APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK (API 36)
        run: |
          set -eux
          # setup-android@v3 ships old cmdline-tools that don't know android-36,
          # so install latest cmdline-tools + API 36 manually.
          # Preinstalled SDK location on ubuntu-latest:
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -z "$SDK_ROOT" ]; then SDK_ROOT=/usr/local/lib/android/sdk; fi
          echo "SDK_ROOT=$SDK_ROOT"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_HOME=$SDK_ROOT" >> $GITHUB_ENV
          mkdir -p "$SDK_ROOT/cmdline-tools"
          cd "$RUNNER_TEMP"
          curl -fsSL -o cmdtools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          rm -rf "$SDK_ROOT/cmdline-tools/latest"
          mkdir -p cmdtools-tmp
          unzip -q cmdtools.zip -d cmdtools-tmp
          mv cmdtools-tmp/cmdline-tools "$SDK_ROOT/cmdline-tools/latest"
          export PATH="$SDK_ROOT/cmdline-tools/latest/bin:$PATH"
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Prepare Hardware & App Environment Configuration
        run: |
          set -eux
          echo "Preparing environment files..."
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
              echo "Created .env from .env.example"
            else
              touch .env
            fi
          fi

          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              echo "Decoding debug.keystore from debug.keystore.base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "Generating fresh debug.keystore..."
              keytool -genkey -v \
                -keystore debug.keystore \
                -alias androiddebugkey \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -storepass android \
                -keypass android \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          echo "Verifying Manifest BLE/Hardware declarations..."
          grep "android.hardware.bluetooth_le" app/src/main/AndroidManifest.xml || true
          grep "BLUETOOTH_CONNECT" app/src/main/AndroidManifest.xml || true

      - name: Build Debug APK (Hardware Testing)
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both'
        run: |
          set -eux
          echo "Gradle version:"
          ./gradlew --version
          echo "Building AccessOS Debug APK..."
          ./gradlew assembleDebug --stacktrace --console=plain

      - name: Build Release APK
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both'))
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -eux
          echo "Building AccessOS Release APK..."
          if [ -z "${STORE_PASSWORD:-}" ] || [ ! -f "${KEYSTORE_PATH:-my-upload-key.jks}" ]; then
            echo "Release keystore secrets not detected - falling back to debug-signed APK for installable artifact..."
            echo "To produce a true signed release, add KEYSTORE_PATH / STORE_PASSWORD / KEY_PASSWORD secrets (or commit an upload keystore)."
            ./gradlew assembleDebug --stacktrace --console=plain
            mkdir -p app/build/outputs/apk/release
            DEBUG_APK=$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)
            echo "Copying $DEBUG_APK to release folder for artifact consistency..."
            cp "$DEBUG_APK" app/build/outputs/apk/release/ || true
          else
            ./gradlew assembleRelease --stacktrace --console=plain
          fi

      - name: Inspect build outputs (diagnostics)
        if: always()
        run: |
          set -eux
          echo "=== DIAGNOSTICS: tree of app/build ==="
          if [ -d app ]; then
            ls -la app || true
            ls -la app/build || true
            find app/build -type f -name '*.apk' -print || true
            find app/build -type f -name '*.apk' -exec ls -lh {} \; || true
          else
            echo "No 'app' module directory found in repo root."
            ls -la || true
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AccessOS-Hardware-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Release APK Artifact (if built)
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: AccessOS-Hardware-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish GitHub Release (on Git Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            hardware/firmware/AccessOs_ESP32_Firmware.ino
            hardware/HARDWARE_SETUP.md
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
          generate_release_notes: true
