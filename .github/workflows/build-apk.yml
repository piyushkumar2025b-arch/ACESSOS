# Robust Android APK build workflow that avoids the deprecated 'tools' package.
# This does NOT use android-actions/setup-android@v3 (which in some versions attempts to install 'tools').
# Instead it installs command-line tools explicitly, accepts licenses non-interactively,
# installs required SDK components, builds, prints diagnostics, and uploads APK artifacts.
name: Build & Release AccessOS Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug, release, or both)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
          - both

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build AccessOS Hardware-Ready APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      ANDROID_SDK_ROOT: ${{ runner.temp }}/android-sdk   # isolated SDK path for this job
      PATH: ${{ runner.temp }}/android-sdk/cmdline-tools/latest/bin:${ { runner.temp }}/android-sdk/platform-tools:${PATH}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java (Temurin 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install Android command-line tools and SDK components (no 'tools' package)
        shell: bash
        run: |
          set -eux

          # Prepare SDK root
          mkdir -p "$ANDROID_SDK_ROOT"
          cd "$RUNNER_TEMP"

          # If sdkmanager already exists in expected path, reuse it; otherwise download command-line tools.
          if [ -x "${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "sdkmanager already available"
          else
            echo "Downloading Android command-line tools..."
            # Try a stable 'latest' endpoint; fallback if one fails. We avoid hardcoding a particular minor version.
            CLI_ZIP="commandlinetools-linux-latest.zip"
            CURL_URLS=(
              "https://dl.google.com/android/repository/commandlinetools-linux-latest.zip"
              "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip"
            )

            downloaded=false
            for url in "${CURL_URLS[@]}"; do
              if curl --fail -fsS -o "$CLI_ZIP" "$url"; then
                downloaded=true
                break
              fi
            done

            if [ "$downloaded" != "true" ]; then
              echo "Failed to download Android command-line tools from known URLs. Attempting to use preinstalled SDK at /usr/local/lib/android/sdk..."
              if [ -x "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager" ]; then
                mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
                cp -a /usr/local/lib/android/sdk/cmdline-tools/latest "$ANDROID_SDK_ROOT/cmdline-tools/"
              else
                echo "No usable sdkmanager found. Exiting."
                exit 1
              fi
            else
              unzip -q "$CLI_ZIP" -d cmdline_tmp
              # The zip usually contains a top-level folder named 'cmdline-tools'
              mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
              # Move the extracted cmdline-tools into 'latest' so sdkmanager path is consistent
              if [ -d cmdline_tmp/cmdline-tools ]; then
                mv cmdline_tmp/cmdline-tools "$ANDROID_SDK_ROOT/cmdline-tools/latest"
              else
                # Some zips might have a nested folder; move whatever was extracted
                mv cmdline_tmp/* "$ANDROID_SDK_ROOT/cmdline-tools/latest"
              fi
            fi
          fi

          # Ensure platform-tools directory exists in PATH for adb/fastboot if needed
          mkdir -p "$ANDROID_SDK_ROOT/platform-tools"

          # Export paths for immediate use in this step
          export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

          echo "Using sdkmanager at: $(command -v sdkmanager || true) || $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"

          # Accept licenses non-interactively and install required packages.
          # IMPORTANT: we do NOT install the deprecated 'tools' package.
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses || true

          # Install modern components required for typical Android builds.
          # Adjust API/build-tools versions to match your project's requirements if different.
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.2" \
            "cmdline-tools;latest"

          # Confirm installed
          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --list || true

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Prepare Hardware & App Environment Configuration
        run: |
          set -eux
          echo "Preparing environment files..."
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              cp .env.example .env
              echo "Created .env from .env.example"
            else
              touch .env
            fi
          fi

          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              echo "Decoding debug.keystore from debug.keystore.base64..."
              base64 -d debug.keystore.base64 > debug.keystore
            else
              echo "Generating fresh debug.keystore..."
              keytool -genkey -v \
                -keystore debug.keystore \
                -alias androiddebugkey \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -storepass android \
                -keypass android \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

          echo "Verifying Manifest BLE/Hardware declarations..."
          grep "android.hardware.bluetooth_le" app/src/main/AndroidManifest.xml || true
          grep "BLUETOOTH_CONNECT" app/src/main/AndroidManifest.xml || true

      - name: Build Debug APK (Hardware Testing)
        if: ${{ github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event_name == 'push' || github.event_name == 'pull_request' }}
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          PATH: ${{ env.ANDROID_SDK_ROOT }}/cmdline-tools/latest/bin:${{ env.ANDROID_SDK_ROOT }}/platform-tools:${{ env.PATH }}
        run: |
          set -eux
          echo "Gradle version:"
          ./gradlew --version
          echo "Building AccessOS Debug APK..."
          ./gradlew assembleDebug --stacktrace --no-daemon --console=plain

      - name: Build Release APK
        if: ${{ github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' }}
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          PATH: ${{ env.ANDROID_SDK_ROOT }}/cmdline-tools/latest/bin:${{ env.ANDROID_SDK_ROOT }}/platform-tools:${{ env.PATH }}
        run: |
          set -eux
          echo "Building AccessOS Release APK..."
          if [ -z "$STORE_PASSWORD" ] || [ ! -f "${KEYSTORE_PATH:-my-upload-key.jks}" ]; then
            echo "Release keystore secrets not detected. Creating installable debug-signed APK..."
            ./gradlew assembleDebug --stacktrace --no-daemon --console=plain
          else
            ./gradlew assembleRelease --stacktrace --no-daemon --console=plain
          fi

      - name: Inspect build outputs (diagnostics)
        if: always()
        run: |
          set -eux
          echo "=== DIAGNOSTICS: tree of app/build ==="
          if [ -d app ]; then
            ls -la app || true
            ls -la app/build || true
            find app/build -type f -name '*.apk' -print || true
            find app/build -type f -name '*.apk' -exec ls -lh {} \; || true
          else
            echo "No 'app' module directory found in repo root."
            ls -la || true
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: AccessOS-Hardware-Debug-APK
          path: app/build/outputs/**/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Release APK Artifact (if built)
        uses: actions/upload-artifact@v4
        if: ${{ hashFiles('app/build/outputs/apk/release/*.apk') != '' }}
        with:
          name: AccessOS-Hardware-Release-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: ignore
          retention-days: 14

      - name: Publish GitHub Release (on Git Tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            hardware/firmware/AccessOs_ESP32_Firmware.ino
            hardware/HARDWARE_SETUP.md
          draft: false
          prerelease: false
          generate_release_notes: true
